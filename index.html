<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>AR Supercar Side View - Hiro Marker</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    #controlPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #statusText {
      color: #fff;
      background: rgba(0,0,0,.72);
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }

    #doorButton {
      pointer-events: auto;
      min-width: 230px;
      padding: 14px 22px;
      border: none;
      border-radius: 14px;
      background: #f7ca0b;
      color: #111;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0,0,0,.42);
      transition: transform .15s, opacity .2s;
    }

    #doorButton:active {
      transform: scale(.96);
    }

    #doorButton:disabled {
      opacity: .42;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div id="controlPanel">
    <div id="statusText">กรุณาส่องกล้องไปที่ Hiro Marker</div>
    <button id="doorButton" disabled>เปิดประตูรถ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true;"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-marker id="hiroMarker" preset="hiro">

      <!--
        หันรถ 90 องศาบนแกน Y เพื่อให้ได้ "มุมมองด้านข้าง"
        ด้านคนขับถูกวางให้เห็นชัดเวลาเปิดประตู
      -->
      <a-entity id="carRoot"
                position="0 0.10 0"
                rotation="0 90 0"
                scale="0.78 0.78 0.78">

        <!-- =========================
             ตัวรถหลัก : Low & Wide
             ========================= -->

        <!-- ฐานรถ -->
        <a-box
          position="0 0.32 0"
          width="2.15"
          height="0.27"
          depth="0.92"
          color="#F2C200"
          material="metalness: 0.42; roughness: 0.28">
        </a-box>

        <!-- ทรงจมูกต่ำ -->
        <a-box
          position="-0.72 0.43 0"
          width="0.80"
          height="0.16"
          depth="0.82"
          rotation="0 0 -7"
          color="#FFD51A"
          material="metalness: 0.35; roughness: 0.24">
        </a-box>

        <!-- ช่วงท้าย -->
        <a-box
          position="0.70 0.43 0"
          width="0.70"
          height="0.24"
          depth="0.88"
          color="#E3B300"
          material="metalness: 0.38; roughness: 0.26">
        </a-box>

        <!-- ห้องโดยสาร -->
        <a-box
          position="0.12 0.63 0"
          width="1.02"
          height="0.32"
          depth="0.70"
          color="#1B252C"
          material="metalness: 0.15; roughness: 0.22">
        </a-box>

        <!-- กระจกหน้า -->
        <a-box
          position="-0.34 0.66 0"
          width="0.48"
          height="0.28"
          depth="0.705"
          rotation="0 0 -18"
          color="#365C70"
          material="opacity: 0.68; transparent: true; metalness: 0.18">
        </a-box>

        <!-- กระจกหลัง -->
        <a-box
          position="0.54 0.66 0"
          width="0.35"
          height="0.25"
          depth="0.70"
          rotation="0 0 19"
          color="#2E5165"
          material="opacity: 0.62; transparent: true">
        </a-box>

        <!-- หลังคาดำ -->
        <a-box
          position="0.12 0.82 0"
          width="0.68"
          height="0.07"
          depth="0.65"
          color="#111418"
          material="metalness: 0.25; roughness: 0.22">
        </a-box>

        <!-- สเกิร์ตด้านข้าง -->
        <a-box
          position="0 0.18 -0.49"
          width="1.72"
          height="0.08"
          depth="0.08"
          color="#111111">
        </a-box>

        <a-box
          position="0 0.18 0.49"
          width="1.72"
          height="0.08"
          depth="0.08"
          color="#111111">
        </a-box>

        <!-- Splitter หน้า -->
        <a-box
          position="-1.02 0.19 0"
          width="0.16"
          height="0.08"
          depth="0.98"
          color="#111111">
        </a-box>

        <!-- Diffuser หลัง -->
        <a-box
          position="1.03 0.18 0"
          width="0.14"
          height="0.10"
          depth="0.96"
          color="#101010">
        </a-box>

        <!-- ช่องลมข้าง -->
        <a-box
          position="0.48 0.36 -0.475"
          width="0.34"
          height="0.17"
          depth="0.025"
          color="#0C0C0C"
          rotation="0 0 -6">
        </a-box>

        <a-box
          position="0.48 0.36 0.475"
          width="0.34"
          height="0.17"
          depth="0.025"
          color="#0C0C0C"
          rotation="0 0 -6">
        </a-box>

        <!-- ไฟหน้า -->
        <a-box
          position="-0.91 0.46 -0.44"
          width="0.28"
          height="0.055"
          depth="0.045"
          color="#F6FCFF"
          material="emissive: #E8F8FF; emissiveIntensity: 1.2">
        </a-box>

        <a-box
          position="-0.91 0.46 0.44"
          width="0.28"
          height="0.055"
          depth="0.045"
          color="#F6FCFF"
          material="emissive: #E8F8FF; emissiveIntensity: 1.2">
        </a-box>

        <!-- ไฟท้าย -->
        <a-box
          position="1.01 0.44 -0.40"
          width="0.05"
          height="0.07"
          depth="0.30"
          color="#D40A0A"
          material="emissive: #B30000; emissiveIntensity: 1">
        </a-box>

        <a-box
          position="1.01 0.44 0.40"
          width="0.05"
          height="0.07"
          depth="0.30"
          color="#D40A0A"
          material="emissive: #B30000; emissiveIntensity: 1">
        </a-box>

        <!-- =========================
             ล้อสปอร์ต 4 ล้อ
             ========================= -->

        <!-- หน้าซ้าย -->
        <a-cylinder
          position="-0.66 0.24 -0.49"
          radius="0.255"
          height="0.16"
          rotation="90 0 0"
          color="#090909">
        </a-cylinder>
        <a-cylinder
          position="-0.66 0.24 -0.575"
          radius="0.155"
          height="0.035"
          rotation="90 0 0"
          color="#9CA3AA"
          material="metalness: .75; roughness: .2">
        </a-cylinder>
        <a-cylinder
          position="-0.66 0.24 -0.598"
          radius="0.065"
          height="0.02"
          rotation="90 0 0"
          color="#F2C200">
        </a-cylinder>

        <!-- หลังซ้าย -->
        <a-cylinder
          position="0.70 0.24 -0.49"
          radius="0.275"
          height="0.17"
          rotation="90 0 0"
          color="#090909">
        </a-cylinder>
        <a-cylinder
          position="0.70 0.24 -0.58"
          radius="0.165"
          height="0.035"
          rotation="90 0 0"
          color="#9CA3AA"
          material="metalness: .75; roughness: .2">
        </a-cylinder>
        <a-cylinder
          position="0.70 0.24 -0.603"
          radius="0.07"
          height="0.02"
          rotation="90 0 0"
          color="#F2C200">
        </a-cylinder>

        <!-- หน้าขวา -->
        <a-cylinder
          position="-0.66 0.24 0.49"
          radius="0.255"
          height="0.16"
          rotation="90 0 0"
          color="#090909">
        </a-cylinder>
        <a-cylinder
          position="-0.66 0.24 0.575"
          radius="0.155"
          height="0.035"
          rotation="90 0 0"
          color="#9CA3AA">
        </a-cylinder>

        <!-- หลังขวา -->
        <a-cylinder
          position="0.70 0.24 0.49"
          radius="0.275"
          height="0.17"
          rotation="90 0 0"
          color="#090909">
        </a-cylinder>
        <a-cylinder
          position="0.70 0.24 0.58"
          radius="0.165"
          height="0.035"
          rotation="90 0 0"
          color="#9CA3AA">
        </a-cylinder>

        <!-- =========================
             สปอยเลอร์หลัง
             ========================= -->
        <a-box
          position="0.82 0.78 0"
          width="0.08"
          height="0.32"
          depth="0.07"
          color="#151515">
        </a-box>

        <a-box
          position="0.82 0.93 0"
          width="0.50"
          height="0.06"
          depth="1.00"
          color="#151515"
          rotation="0 0 3">
        </a-box>

        <!-- =========================
             ประตูฝั่งที่เห็นชัด
             Scissor Door
             ========================= -->

        <!-- ประตูฝั่งใกล้กล้อง -->
        <a-entity id="leftDoorPivot"
                  position="-0.20 0.56 -0.47"
                  rotation="0 0 0">

          <a-box
            position="0.32 0.00 0"
            width="0.66"
            height="0.42"
            depth="0.07"
            color="#FFD51A"
            material="metalness: 0.38; roughness: 0.24">
          </a-box>

          <!-- กระจกประตู -->
          <a-box
            position="0.27 0.17 -0.01"
            width="0.48"
            height="0.18"
            depth="0.075"
            color="#31566A"
            material="opacity: 0.68; transparent: true">
          </a-box>

          <!-- เส้นตกแต่งบนประตู -->
          <a-box
            position="0.36 -0.10 -0.041"
            width="0.32"
            height="0.045"
            depth="0.018"
            color="#111111">
          </a-box>
        </a-entity>

        <!-- ประตูฝั่งไกล -->
        <a-entity id="rightDoorPivot"
                  position="-0.20 0.56 0.47"
                  rotation="0 0 0">

          <a-box
            position="0.32 0.00 0"
            width="0.66"
            height="0.42"
            depth="0.07"
            color="#FFD51A"
            material="metalness: 0.38; roughness: 0.24">
          </a-box>

          <a-box
            position="0.27 0.17 0.01"
            width="0.48"
            height="0.18"
            depth="0.075"
            color="#31566A"
            material="opacity: 0.62; transparent: true">
          </a-box>
        </a-entity>

        <!-- กระจกมองข้าง -->
        <a-box
          position="-0.26 0.66 -0.57"
          width="0.20"
          height="0.08"
          depth="0.12"
          color="#F2C200">
        </a-box>

        <a-box
          position="-0.26 0.66 0.57"
          width="0.20"
          height="0.08"
          depth="0.12"
          color="#F2C200">
        </a-box>

        <!-- ช่องเครื่องยนต์หลัง -->
        <a-box
          position="0.64 0.58 0"
          width="0.42"
          height="0.04"
          depth="0.55"
          color="#171717">
        </a-box>

        <!-- ท่อไอเสีย -->
        <a-cylinder
          position="1.09 0.22 -0.18"
          radius="0.055"
          height="0.12"
          rotation="0 0 90"
          color="#6C7074">
        </a-cylinder>

        <a-cylinder
          position="1.09 0.22 0.18"
          radius="0.055"
          height="0.12"
          rotation="0 0 90"
          color="#6C7074">
        </a-cylinder>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const marker = document.getElementById("hiroMarker");
      const doorButton = document.getElementById("doorButton");
      const statusText = document.getElementById("statusText");

      const leftDoor = document.getElementById("leftDoorPivot");
      const rightDoor = document.getElementById("rightDoorPivot");

      let markerVisible = false;
      let doorsOpen = false;

      marker.addEventListener("markerFound", () => {
        markerVisible = true;
        doorButton.disabled = false;
        statusText.textContent = "พบ Hiro Marker แล้ว ✓  มุมมองด้านข้าง";
      });

      marker.addEventListener("markerLost", () => {
        markerVisible = false;
        doorButton.disabled = true;
        statusText.textContent = "กรุณาส่องกล้องไปที่ Hiro Marker";
      });

      doorButton.addEventListener("click", () => {
        if (!markerVisible) return;

        doorsOpen = !doorsOpen;

        leftDoor.removeAttribute("animation__door");
        rightDoor.removeAttribute("animation__door");

        if (doorsOpen) {

          /*
             ยกประตูขึ้นแบบ Scissor Door
             หมุนแกน Z เพราะมุมมองด้านข้างจะเห็นการยกขึ้นชัดเจน
          */
          leftDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 78; dur: 850; easing: easeInOutCubic"
          );

          rightDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 -62; dur: 850; easing: easeInOutCubic"
          );

          doorButton.textContent = "ปิดประตูรถ";
          statusText.textContent = "ประตู Scissor Door เปิดอยู่";

        } else {

          leftDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 0; dur: 850; easing: easeInOutCubic"
          );

          rightDoor.setAttribute(
            "animation__door",
            "property: rotation; to: 0 0 0; dur: 850; easing: easeInOutCubic"
          );

          doorButton.textContent = "เปิดประตูรถ";
          statusText.textContent = "ประตูรถปิดอยู่";
        }
      });
    });
  </script>

</body>
</html>
